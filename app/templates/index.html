<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <h1>Task Manager</h1>
        <p class="subtitle">Manage your daily tasks</p>

        <form action="/add" method="POST" class="task-form">
            <input
                type="text"
                name="title"
                placeholder="Enter a new task..."
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <div class="task-list">

            {% for task in tasks %}
                <div class="task">

                    <span class="{% if task['completed'] %}completed{% endif %}">
                        {{ task['title'] }}
                    </span>

                    <div class="actions">

                        <form action="/complete/{{ task['id'] }}"
                              method="POST">
                            <button type="submit" class="complete">
                                {% if task['completed'] %}
                                    Undo
                                {% else %}
                                    Complete
                                {% endif %}
                            </button>
                        </form>

                        <form action="/delete/{{ task['id'] }}"
                              method="POST">
                            <button type="submit" class="delete">
                                Delete
                            </button>
                        </form>

                    </div>
                </div>
            {% else %}
                <p class="empty">No tasks yet. Add your first task!</p>
            {% endfor %}

        </div>

    </div>
</body>
</html>
